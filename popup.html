<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 320px;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
          sans-serif;
      }

      .header {
        text-align: center;
        margin-bottom: 16px;
      }

      .logo {
        font-size: 24px;
        margin-bottom: 8px;
      }

      .title {
        font-size: 18px;
        font-weight: 600;
        color: #232f3e;
        margin: 0;
      }

      .subtitle {
        font-size: 14px;
        color: #666;
        margin: 4px 0 0 0;
      }

      .section {
        margin: 16px 0;
        padding: 12px;
        background: #f8f9fa;
        border-radius: 8px;
      }

      .section h3 {
        margin: 0 0 8px 0;
        font-size: 14px;
        font-weight: 600;
        color: #232f3e;
      }

      .section p {
        margin: 0;
        font-size: 13px;
        color: #666;
        line-height: 1.4;
      }

      .college-selector {
        margin: 16px 0;
      }

      .college-selector label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        font-weight: 600;
        color: #232f3e;
      }

      .college-selector select {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 13px;
        background: white;
        color: #333;
      }

      .college-selector select:focus {
        outline: none;
        border-color: #ff9900;
        box-shadow: 0 0 0 2px rgba(255, 153, 0, 0.2);
      }

      .current-selection {
        margin-top: 8px;
        padding: 8px;
        background: #e8f5e8;
        border-radius: 4px;
        font-size: 12px;
        color: #2d5a2d;
      }

      .buttons {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .button {
        background: linear-gradient(to bottom, #f7dfa5, #f0c14b);
        border: 1px solid #a88734;
        border-radius: 3px;
        color: #111;
        font-size: 13px;
        font-weight: 400;
        padding: 8px 16px;
        text-decoration: none;
        display: block;
        text-align: center;
        cursor: pointer;
        transition: all 0.1s ease-in-out;
      }

      .button:hover {
        background: linear-gradient(to bottom, #f5d78e, #eeb933);
        border-color: #9c7e31;
      }

      .button.secondary {
        background: #fff;
        border: 1px solid #ddd;
        color: #232f3e;
      }

      .button.secondary:hover {
        background: #f8f9fa;
      }

      .status {
        text-align: center;
        padding: 12px;
        font-size: 13px;
        color: #666;
      }

      .footer {
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid #e7e7e7;
        text-align: center;
        font-size: 11px;
        color: #888;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo">📚</div>
      <h1 class="title">KOSEN-OPAC-Checker</h1>
      <p class="subtitle">Amazon・楽天市場書籍を図書館で検索</p>
    </div>

        <option value="24">沼津工業高等専門学校</option>
        <option value="25">豊田工業高等専門学校</option>
        <option value="26">鳥羽商船高等専門学校</option>
        <option value="27">鈴鹿工業高等専門学校</option>

      <div class="current-selection" id="currentSelection">読み込み中...</div>
    </div>

    <div class="section">
      <h3>使い方</h3>
      <p>
        上で高専を選択した状態でAmazon
        または楽天ブックスの書籍ページを開くと、自動的に選択した高専図書館の蔵書情報を表示します。

    <div class="buttons">
      <a href="https://books.rakuten.co.jp/" target="_blank" class="button">
        楽天ブックス で本を探す
      </a>
      <a
        href="https://www.amazon.co.jp/s?k=本&ref=nb_sb_noss"
        target="_blank"
        class="button"
      >
        Amazon で本を探す
      </a>
      <a href="#" id="libraryLink" target="_blank" class="button secondary">
        選択中の図書館カタログを開く
      </a>
    </div>

    <div class="status" id="status">
      現在のページ: <span id="currentPage">-</span>
    </div>

    <div class="footer" id="versionFooter">Amazon・楽天ブックス対応版</div>

    <script src="popup.js"></script>
  </body>
</html>
